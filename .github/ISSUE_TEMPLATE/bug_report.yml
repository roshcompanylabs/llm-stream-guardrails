name: Bug report
description: Something behaves differently from what the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the bug is that a sensitive value **got through**, please stop and report it
        privately instead: **Security → Report a vulnerability**.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest input, policy and chunking that shows it. Please replace any real
        secret with a structurally identical fake.
      render: javascript
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: llm-stream-guardrails 0.7.0, node 20.x
    validations:
      required: true
