name: Release

# Publishing happens here rather than from a laptop, for two reasons: npm only
# issues a provenance attestation for a build it can verify, which means a run
# it can see; and a token scoped to this workflow removes the interactive OTP
# prompt without weakening the account's own two-factor requirement.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      # The same gates CI runs on every push. A release is not a reason to skip them.
      - run: npm test
      - name: Precision gate (0 false positives required)
        run: npm run bench
      - name: Leak gate (no build-machine paths in the tarball)
        run: node scripts/leak-gate.mjs

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version $PKG"

      - name: Publish with provenance
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --provenance --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
