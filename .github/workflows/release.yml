name: Release

# Publishing runs here rather than from a laptop so npm can verify the build and
# issue a provenance attestation for it.
#
# Authentication is npm Trusted Publishing (OIDC): the job proves its identity to
# the registry with a short-lived token minted by GitHub for this workflow, so
# there is no npm token in this repository at all. npm removed the 2FA bypass
# from automation tokens in August 2026 and is revoking classic tokens, which
# makes this the only supported way to publish from CI.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+ and Node 22.14+. Node 22 ships
          # an older npm, so the CLI is upgraded explicitly below rather than
          # left to whatever the runner image happens to carry.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run build

      # The same gates CI runs on every push. A release is not a reason to skip them.
      - run: npm test
      - name: Precision gate (0 false positives required)
        run: npm run bench
      - name: Leak gate (no build-machine paths in the tarball)
        run: node scripts/leak-gate.mjs

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version $PKG"

      # No --provenance flag and no token: trusted publishing attaches the
      # attestation on its own.
      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --access public

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: npm publish --access public --dry-run
